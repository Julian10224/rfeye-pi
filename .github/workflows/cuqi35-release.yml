name: Build RF Eye main update artifact

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, 'Build RF Eye release artifact') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Build main update ZIP and manifest
        env:
          RFEYE_BRANCH: main
        run: |
          chmod +x scripts/build-release.sh
          ./scripts/build-release.sh
      - name: Commit release artifact when changed
        run: |
          if git diff --quiet -- update/manifest.json update/rfeye-update.zip; then
            echo "Release artifact already current"
            exit 0
          fi
          VERSION="$(tr -d '[:space:]' < VERSION)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update/manifest.json update/rfeye-update.zip
          git commit -m "Build RF Eye release artifact ${VERSION}"
          git push origin HEAD:main
