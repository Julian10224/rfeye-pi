name: Build CUQI update artifact

on:
  push:
    branches:
      - display-cuqi-35-portrait

permissions:
  contents: write

jobs:
  release:
    if: ${{ !contains(github.event.head_commit.message, 'Build CUQI release artifact') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: display-cuqi-35-portrait
          fetch-depth: 0
      - name: Build branch update ZIP and manifest
        env:
          RFEYE_BRANCH: display-cuqi-35-portrait
        run: |
          chmod +x scripts/build-release.sh
          ./scripts/build-release.sh
      - name: Commit release artifact when changed
        run: |
          if git diff --quiet -- update/manifest.json update/rfeye-update.zip; then
            echo "Release artifact already current"
            exit 0
          fi
          VERSION="$(tr -d '[:space:]' < VERSION)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update/manifest.json update/rfeye-update.zip
          git commit -m "Build CUQI release artifact ${VERSION}"
          git push origin HEAD:display-cuqi-35-portrait
