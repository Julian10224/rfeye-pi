name: RF Eye 0.9.9 appliance checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  source-of-truth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y device-tree-compiler python3-numpy python3-pygame
      - name: Check shell and Python syntax
        run: |
          bash -n install.sh install-cuqi35.sh scripts/start-rfeye.sh \
            scripts/apply-cuqi35-system-fixes.sh scripts/optimize-rpi-appliance.sh \
            scripts/install-networkmanager-policy.sh scripts/build-release.sh
          python3 -m py_compile rfeye/*.py scripts/*.py
      - name: Run application and updater regression tests
        run: |
          PYTHONPATH=rfeye SDL_VIDEODRIVER=dummy python3 scripts/app-selftest.py
          PYTHONPATH=rfeye python3 scripts/updater-selftest.py
      - name: Run TETRA waveform regression tests
        run: PYTHONPATH=rfeye python3 scripts/tetra-phy-selftest.py
      - name: Run end-to-end detector regression tests
        run: PYTHONPATH=rfeye python3 scripts/detector-selftest.py
      - name: Verify release identity and compact UI
        run: |
          V="$(tr -d '[:space:]' < VERSION)"
          grep -q "\"app_version\": \"${V}\"" rfeye/config.py
          # The release identity lives in VERSION, config.py, the reference
          # config, the manifest and the README. It has drifted before, and a
          # stale README version is what the settings screen quotes back at
          # the user, so every copy is checked here.
          grep -q "^# RF Eye ${V} for Raspberry Pi\$" README.md
          grep -q "complete \*\*RF Eye ${V} reference appliance\*\*" README.md
          grep -q "identify this release as \*\*${V}\*\*" README.md
          grep -q 'self.uw,self.uh,self.pw,self.ph=320,480,480,320' rfeye/compact_display_patch.py
          # 0.9.6: which panel layout to draw may not depend on the service
          # environment alone. That variable is written by install-cuqi35.sh,
          # which an application-only OTA cannot touch, so a unit predating it
          # kept sending the 480x800 layout to a 480x320 panel.
          grep -q 'def wants_compact_profile' rfeye/compact_display_patch.py
          grep -q 'def _config_display_profile' rfeye/compact_display_patch.py
          grep -q 'if not wants_compact_profile(): return' rfeye/compact_display_patch.py
          # 0.9.7: one exception in a draw path used to end the process.
          # systemd restarts it half a second later, so a fault repeating
          # every frame became a restart loop showing only the compositor's
          # black background -- no message, and no way in from the touch
          # screen. The appliance has to stay up and say what happened.
          grep -q 'def _guarded_frame' rfeye/app.py
          grep -q 'def _note_frame_error' rfeye/app.py
          grep -q 'def _draw_frame_error' rfeye/app.py
          grep -q 'self._guarded_frame()' rfeye/app.py
          grep -q 'crash.log' rfeye/app.py
          # 0.9.8: the guard must not become a trap, and a unit that goes
          # dark across a power cut has to leave something behind. The
          # user journal does not survive a power cut on these units.
          grep -q 'def boot_note' rfeye/app.py
          grep -q 'boot.log' rfeye/app.py
          grep -q 'frame_error_streak' rfeye/app.py
          grep -q 'FRAME_ERROR_RESTART_FRAMES' rfeye/app.py
          grep -q 'SETTINGS_COUNT=8' rfeye/compact_ui_draw.py
          ! grep -q 'Sensitivity' rfeye/compact_ui_draw.py
          ! grep -q 'threshold_db' rfeye/compact_ui_draw.py rfeye/compact_ui_controls.py rfeye/app.py
          grep -q 'if app.page == "record_confirm"' rfeye/compact_ui_controls.py
          grep -q 'if 350 <= y <= 455' rfeye/compact_ui_controls.py
          grep -q 'TOUCH CALIBRATION' rfeye/compact_ui_draw.py
          grep -q 'Made by: Julian' rfeye/compact_ui_draw.py
          grep -q '"audio_mode": "adaptive"' rfeye/config.py
          grep -q 'self._request_app_restart(0.75)' rfeye/app.py
          grep -q 'if self.update_message == "RESTART"' rfeye/app.py
          grep -q '^Restart=always$' config/systemd/rfeye-user.service.in
          # 0.9.9: five quick failures at boot used to leave the unit in
          # failed (start-limit-hit) for good -- desktop up, mouse cursor,
          # no application, and nothing in any log. An appliance keeps trying.
          grep -q '^StartLimitIntervalSec=0$' config/systemd/rfeye-user.service.in
          grep -q '^RestartSec=2$' config/systemd/rfeye-user.service.in
          ! grep -q '^RestartSec=0.5$' config/systemd/rfeye-user.service.in
          grep -q 'def _build_app' rfeye/app.py
          grep -q '_build_app(cfg, fullscreen).run()' rfeye/app.py
          # Detector profile v8 waveform verification must be present. These
          # guard the physics: the symbol rate and slot length are ETSI
          # constants, not tuning knobs, and a silent edit to either would
          # invalidate every acceptance limit derived from them.
          grep -q 'SYMBOL_RATE_HZ = 18000.0' rfeye/tetra_phy.py
          grep -q 'SYMBOLS_PER_SLOT = 255' rfeye/tetra_phy.py
          grep -q 'SLOTS_PER_FRAME = 4' rfeye/tetra_phy.py
          grep -q 'class Channelizer' rfeye/tetra_phy.py
          grep -q 'def dqpsk_moments' rfeye/tetra_phy.py
          grep -q 'def modulation_scores' rfeye/tetra_phy.py
          grep -q 'def tdma_timing' rfeye/tetra_phy.py
          grep -q 'def analyse' rfeye/tetra_phy.py
          grep -q 'class SiteRegistry' rfeye/tetra_detector.py
          grep -q 'class UplinkAlarm' rfeye/tetra_detector.py
          grep -q 'def plan_dwell' rfeye/tetra_detector.py
          grep -q 'def _refill_site_queue' rfeye/sdr_backend.py
          # A lock must keep proving itself: without this a deaf
          # receiver kept reporting a locked network for an hour.
          grep -q 'def note_round' rfeye/tetra_detector.py
          grep -q 'def network_alive' rfeye/tetra_detector.py
          grep -q 'self.sites.note_round' rfeye/sdr_backend.py
          grep -q 'rfeye-rf-series-v8' rfeye/compact_ui_controls.py
          # The USB recovery discipline of 0.9.1. Resetting on any error text
          # containing 'read failed' also reset when the dongle was simply
          # absent, which stopped it re-enumerating during a supply sag and
          # left it dead until reboot. Keep that specific guard.
          grep -q 'def _sdr_present' rfeye/sdr_backend.py
          grep -q 'def _power_warning' rfeye/sdr_backend.py
          grep -q "'open failed' not in low" rfeye/sdr_backend.py
          # 0.9.5: the supply warning is a one-shot notice over a running
          # scan, not a screen state. Bit 16 of get_throttled latches at the
          # first dip and never clears, so treating it as a warning pinned
          # "USB POWER TOO LOW" on the display for the rest of the session.
          grep -q 'USB POWER TOO LOW' rfeye/app.py
          grep -q 'SDR LOST - USB POWER LOW' rfeye/compact_ui_draw.py rfeye/app.py
          grep -q 'def _power_notice_tap' rfeye/app.py
          grep -q 'def _draw_power_notice' rfeye/app.py
          grep -q 'BEGREPEN' rfeye/app.py
          grep -q '_power_notice_tap' rfeye/compact_ui_controls.py
          grep -q '_power_history' rfeye/sdr_backend.py
          ! grep -q "elif bits & 0x10000" rfeye/sdr_backend.py
          # Time to lock is decided by queue order, and the reason a pass
          # found nothing has to be recoverable after the drive, not only
          # while someone is watching the screen.
          grep -q '_survey_scores' rfeye/sdr_backend.py
          grep -q 'def _log_pass' rfeye/sdr_backend.py
          grep -q 'def _note_pass_best' rfeye/sdr_backend.py
          grep -q 'search_best' rfeye/sdr_backend.py rfeye/compact_ui_draw.py
          # The v6/v7 energy-statistics machinery was removed because each
          # piece could suppress a real detection. Fail if any of it returns.
          ! grep -q '_annotate_mobile_temporal' rfeye/sdr_backend.py
          ! grep -q '_apply_broadband_guard' rfeye/sdr_backend.py
          ! grep -q '_reject_coherent_comb' rfeye/sdr_backend.py
          ! grep -q 'artifact-baseline.json' rfeye/sdr_backend.py
          ! grep -q 'debug_mobile_candidates' rfeye/compact_ui_controls.py
          grep -q 'strftime("%Y-%m-%d_%H-%M-%S")' rfeye/compact_ui_controls.py
          grep -q 'app.page="recordings"' rfeye/compact_ui_controls.py
          grep -q 'def draw_recording_replay' rfeye/compact_ui_draw.py
          grep -q 'class ReplayEngine' rfeye/recording_replay.py
          grep -q 't.join(timeout=' rfeye/sdr_backend.py
          grep -q 'finally:' rfeye/sdr_backend.py
          grep -q 'sdr_stop_join_s' rfeye/config.py
          grep -q 'def _safe_extract_runtime' rfeye/updater.py
          grep -q 'valid SHA256 is required' rfeye/updater.py
          grep -q 'def _split_nmcli_terse' rfeye/app.py
          grep -q 'Re-discover on every retry' rfeye/compact_touch.py
          ! grep -q 'm=\[\]' rfeye/sdr_backend.py
          ! grep -q 'python3 scripts/patch-' install.sh install-cuqi35.sh scripts/build-release.sh
          test -z "$(find scripts -maxdepth 1 -type f -name 'patch-*.py' -print -quit)"
      - name: Verify captured reference startup files
        run: |
          printf '%s  %s\n' \
            '4a24897b09e3dfee4c99a1c39fc8b28a6489fc7bbd7f0709e176e70099b686af' 'config/systemd/lightdm.service' \
            '18dceb032fac2d7bbf871e07199bc1b1ea8fb3291fa24b07fe78ec8956a6961d' 'config/systemd/systemd-user-sessions.service' \
            '2876bfda5ce3a28cc6c08213ba637f34fe3c647dfdc6c23252d1e00a2d044884' 'config/systemd/rfeye-user-fast-ui.conf' \
            'b2c64ea2a80c4bf785780f8f6d2cc4cb3ee4132c90fb089e08776e8dc9625f76' 'config/labwc-autostart' \
            '9d74c1cdbd13b40c0e502a953a26ed2b9abff763b62715943796aeabc7617c96' 'config/kanshi-config' \
            'be5c897064e26e8120f40502286fc811b4ddfbef2f2fcfbc5a56fd3fbbba813f' 'scripts/start-rfeye.sh' \
            | sha256sum -c -
          ! grep -q 'renderD128' config/systemd/lightdm.service
          grep -q 'dev-dri-card0.device' config/systemd/lightdm.service
          ! grep -q 'network.target' config/systemd/systemd-user-sessions.service
          grep -q '^ExecStart=/opt/rfeye/start-rfeye.sh$' config/systemd/rfeye-user.service.in
          grep -q 'config/overlays/rfeye-mhs35.dts' scripts/apply-cuqi35-system-fixes.sh
          grep -q 'config/systemd/lightdm.service' scripts/apply-cuqi35-system-fixes.sh
          grep -q 'reference-config-cuqi35.json' install-cuqi35.sh
          dtc -@ -I dts -O dtb -o /tmp/rfeye-mhs35-test.dtbo config/overlays/rfeye-mhs35.dts
          echo '1727ca3c3161bd90db1cbc7a076dad692d34ee67c7acf70afab28fbf16fdec34  /tmp/rfeye-mhs35-test.dtbo' | sha256sum -c -
      - name: Verify fresh-install reference settings
        run: |
          python3 - <<'PY'
          import json
          c=json.load(open('config/reference-config-cuqi35.json'))
          assert c['app_version']==open('VERSION').read().strip()
          assert c['display_profile']=='cuqi35'
          assert (c['ui_width'],c['ui_height'])==(320,480)
          assert (c['physical_width'],c['physical_height'])==(480,320)
          assert c['detector_profile_version']==9
          # Detector profile v8 acceptance limits. A fresh install must ship
          # the calibrated values from scripts/tetra-phy-selftest.py, so a
          # silent drift here is a build failure rather than a field surprise.
          assert c['phy_sample_rate']==288000
          assert c['phy_dwell_log2']==18
          assert c['phy_decimation']==8
          assert c['phy_timing_phases']==8
          assert c['phy_max_offset_hz']==100000.0
          assert c['phy_min_snr_db']==8.0
          assert c['phy_min_occupied_bw_hz']==14000.0
          assert c['phy_max_occupied_bw_hz']==30000.0
          assert c['phy_min_boundary_reject_db']==6.0
          assert c['phy_max_flatness_db']==14.0
          assert c['phy_max_centre_error_hz']==8000.0
          assert c['phy_min_dqpsk_m']==0.20
          assert c['phy_min_dqpsk_phase_spread']==0.50
          assert c['phy_min_dqpsk_selectivity']==1.35
          assert c['phy_downlink_min_duty']==0.15
          assert c['phy_uplink_min_duty']==0.04
          assert c['phy_uplink_max_duty']==0.85
          assert c['phy_uplink_min_frame_ratio']==3.0
          assert c['phy_uplink_min_slot_quantisation']==0.45
          assert c['phy_uplink_min_bursts']==3
          assert c['duplex_split_hz']==10000000.0
          assert c['site_lock_hits']==3
          assert c['site_unlock_misses']==4
          assert c['site_reverify_s']==60.0
          assert c['site_lost_rounds']==3
          assert c['site_lock_stale_s']==600.0
          assert c['site_state_persist'] is True
          assert c['survey_min_snr_db']==6.0
          assert c['survey_max_candidates']==12
          assert c['uplink_confirm_dwells']==2
          assert c['uplink_confirm_visits']==4
          assert c['survey_flatness_weight']==0.5
          assert c['uplink_alert_hold_s']==12.0
          assert c['tetra_channel_spacing_hz']==25000.0
          assert c['tetra_raster_offset_hz']==12500.0
          assert c['sample_rate']==2048000
          assert c['sdr_stop_join_s']==8.0
          assert c['sdr_device_index']==0
          assert c['startup_chime'] is True
          assert c['audio_mode']=='adaptive'
          assert len(c['touch_calibration_affine'])==6
          # Every v6/v7 energy-statistics key must be gone, not merely unused.
          for dead in ('artifact_baseline_persist','artifact_comb_period_hz',
                       'temporal_baseline_alpha','broadband_dynamic_keep_max',
                       'novelty_min_departure','duplex_pair_min_quality',
                       'candidate_min_confidence','strong_hit_confidence',
                       'require_duplex_pair','site_pair_min_hits',
                       'mobile_capture_ms','site_capture_ms','fft_blocks',
                       'confirm_hits','threshold_db','buzzer_duration_ms',
                       'uplink_confirm_window_s',
                       'buzzer_high_hz','buzzer_low_hz'):
              assert dead not in c, dead
          assert 'password' not in ''.join(c).lower()
          PY
      - name: Verify shipped limits match the calibrated defaults
        run: |
          PYTHONPATH=rfeye python3 - <<'PY'
          import json
          import tetra_phy, config
          c = json.load(open('config/reference-config-cuqi35.json'))
          for k, v in tetra_phy.LIMITS.items():
              assert config.DEFAULTS[k] == v, (k, config.DEFAULTS[k], v)
              assert c[k] == v, (k, c[k], v)
          print('%d acceptance limits agree across module, defaults and reference config'
                % len(tetra_phy.LIMITS))
          PY
      - name: Verify deterministic OTA artifact
        run: |
          chmod +x scripts/build-release.sh
          ./scripts/build-release.sh
          H1="$(sha256sum update/rfeye-update.zip | awk '{print $1}')"
          ./scripts/build-release.sh
          H2="$(sha256sum update/rfeye-update.zip | awk '{print $1}')"
          test "$H1" = "$H2"
          V="$(tr -d '[:space:]' < VERSION)"
          test "$(python3 -c 'import json; print(json.load(open("update/manifest.json"))["version"])')" = "$V"
          test "$(python3 -c 'import json; print(json.load(open("update/manifest.json"))["sha256"])')" = "$H2"
