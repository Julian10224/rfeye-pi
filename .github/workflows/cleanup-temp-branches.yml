name: Cleanup temporary branches

on:
  push:
    branches:
      - display-cuqi-35-portrait

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Delete merged temporary branches
        run: |
          for branch in \
            tmp-cuqi-0723-boot-speed \
            tmp-rfeye-should-not-create \
            tmp-rfeye-should-not-create-2
          do
            git push origin --delete "$branch" || true
          done
