name: Delete legacy display branch

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Delete old display branch
        run: git push origin --delete display-cuqi-35-portrait || true
